spring.application.name=orcamento-voz-api
server.address=127.0.0.1
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/orcamento;WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.error.include-message=never
server.error.include-stacktrace=never
app.ai.enabled=${AI_ENABLED:false}
app.ai.api-key=${OPENAI_API_KEY:}
app.ai.chat-model=${CHAT_MODEL:gpt-4o-mini}
app.ai.transcription-model=${TRANSCRIPTION_MODEL:whisper-1}
app.ai.speech-model=${SPEECH_MODEL:tts-1}
